[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.1.0"
description = "Reproducible, cash-funded BTC-USD trend-following research"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
keel = "keel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
